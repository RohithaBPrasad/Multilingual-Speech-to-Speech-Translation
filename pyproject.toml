[project]
name = "multilingual-speech-to-speech"
version = "1.0.0"
description = "Multilingual speech-to-speech translation using Whisper, NLLB-200 and MMS TTS"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]
